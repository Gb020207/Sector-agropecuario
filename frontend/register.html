<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSmart - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    
</head>
<body>
    <div class="container" id="container">
        <!-- PANEL DE REGISTRO -->
        <div class="form-container sign-up-container">
            <form id="registerForm" onsubmit="register(event)">
                <h1>Crear Cuenta</h1>
                <input type="text" id="profile" placeholder="Nombre y Apellido" required>
                <input type="text" id="username" placeholder="Usuario" required>
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Registrarme</button>
            </form>
        </div>

        <!-- PANEL DE INICIO DE SESIÓN -->
        <div class="form-container sign-in-container">
            <form id="loginForm" onsubmit="login(event)">
                <h1>Iniciar Sesión</h1>
                <input type="text" id="usernameLog" placeholder="Correo o Usuario" required>
                <input type="password" id="passwordLog" placeholder="Contraseña" required>
                <a href="#">¿Olvidaste tu contraseña?</a>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- PANEL LATERAL ANIMADO -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>¡Bienvenido a AgroSmart!</h1>
                    <p>Gestiona tu campo de manera inteligente y sostenible.</p>
                    <button class="ghost" id="signIn">Ya tengo una cuenta</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>¡Hola, productor!</h1>
                    <p>¿Aún no tienes cuenta? Regístrate para empezar a monitorear tu campo.</p>
                    <button class="ghost" id="signUp">Registrarme</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./assets/js/register.js"></script>
  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/animation.js"></script>
   
</body>
</html>
