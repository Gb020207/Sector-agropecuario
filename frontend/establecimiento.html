<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSmart - Establecimiento</title>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/establecimiento.css">
</head>
<body>

  <!-- 🔝 NAVBAR -->
  <header class="navbar">
    <a href="#" class="navbar-brand">
      <i class="fas fa-leaf brand-icon"></i> AgroSmart
    </a>
    <nav>
      <ul>
        <li><a href="home.html">Inicio</a></li>
        <li><a href="establecimiento.html" class="active">Establecimiento</a></li>
        <li><a href="clima.html">El Clima</a></li>
        <li><a href="chat.html">AgroBot</a></li>
      </ul>
    </nav>
    <button class="btn-logout" id="logOut" onclick="logOut()">
      <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
    </button>
  </header>

  <!-- 🏡 HERO -->
  <section class="hero" id="parcela">
    <div class="hero-content">
      <h1><span>Establecimiento</span></h1>
      <p>Monitorea el estado de tus parcelas, cultivos y ganado.</p>
      <a href="#mapa" class="btn-primary">Explorar</a>
    </div>
  </section>

  <!-- 🗺️ MAPA + PANEL -->
  <section id="mapa" class="map-container">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="section">
        <h3><i class="fas fa-map"></i> Mis Parcelas</h3>
        <div id="listaParcelas" class="list"></div>
        <button id="btnNuevaParcela" class="btn-add">
          <i class="fas fa-plus"></i> Registrar Parcela
        </button>
      </div>

      <div class="section">
        <h3><i class="fas fa-seedling"></i> Cultivos</h3>
        <div id="listaCultivos" class="list"></div>
      </div>

      <div class="section">
        <h3><i class="fas fa-cow"></i> Ranchos</h3>
        <div id="listaRanchos" class="list"></div>
      </div>
    </aside>
  </section>

  <!-- 📩 FOOTER -->
  <footer>
    <p>© 2025 AgroSmart | Plataforma integral para la gestión agropecuaria.</p>
  </footer>

  <!-- 🎬 Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/js/home.js"></script>
  <script src="assets/js/logOut.js"></script>
  <script src="assets/js/establecimiento.js"></script>
</body>
</html>
