<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Parcela</title>
  <link rel="stylesheet" href="./assets/css/registro-parcela.css">
</head>
<body>
  <header class="navbar">
    <a href="establecimiento.html" class="navbar-brand">AgroSmart</a>
  </header>

  <section class="form-section">
    <h2>Registrar Nueva Parcela</h2>
    <form id="formParcela">
      <label for="name">Nombre de la Parcela:</label>
      <input type="text" id="name" name="name" required>

      <label for="size">Tamaño (ha):</label>
      <input type="number" id="size" name="size" required>

      <label for="crop">Cultivo:</label>
      <select id="crop" name="crop" required></select>

      <button type="submit" class="btn-primary">Registrar Parcela</button>
    </form>
  </section>

  <script>
 document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('formParcela');
  const cropSelect = document.getElementById('crop');

  // ✅ Cargar cultivos
  const cultivos = ['Soja', 'Maíz', 'Trigo', 'Girasol', 'Arroz', 'Poroto', 'Algodon', 'Frutilla', 'Zanahoria', 'Papa'];
  cultivos.forEach(c => {
    const option = document.createElement('option');
    option.value = c;
    option.textContent = c;
    cropSelect.appendChild(option);
  });

  // ✅ Manejar el envío del formulario
  form.addEventListener('submit', (e) => {
    e.preventDefault();

    // Crear objeto parcela
    const nuevaParcela = {
      name: form.name.value,
      size: form.size.value,
      crop: { name: form.crop.value },
      lat: -26.18 + Math.random() * 0.2,
      lng: -58.17 + Math.random() * 0.2
    };

    // Leer y guardar en localStorage
    const parcelas = JSON.parse(localStorage.getItem('parcelas')) || [];
    parcelas.push(nuevaParcela);
    localStorage.setItem('parcelas', JSON.stringify(parcelas));

    console.log('📦 Parcela guardada:', nuevaParcela);
    alert('✅ Parcela registrada correctamente');

    // Redirigir al establecimiento
    window.location.replace('establecimiento.html');
  });
});
  </script>
</body>
</html>

  </script>
</body>
</html>
