<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Parcela</title>
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/registro.css">
</head>
<body>
  <header class="navbar">
    <a href="establecimiento.html" class="navbar-brand">AgroSmart</a>
  </header>

  <section class="form-section">
    <h2>Registrar Nueva Parcela</h2>
    <form id="formParcela">
      <label for="name">Nombre de la Parcela:</label>
      <input type="text" id="name" name="name" required>

      <label for="size">Tamaño (ha):</label>
      <input type="number" id="size" name="size" required>

      <label for="crop">Cultivo:</label>
      <select id="crop" name="crop" required></select>

      <button type="submit" class="btn-primary">Registrar Parcela</button>
    </form>
  </section>

  <script src="assets/js/registro-parcela.js"></script>
</body>
</html>
